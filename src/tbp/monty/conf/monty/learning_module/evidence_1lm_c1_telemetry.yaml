# @package experiment.config.monty_config.learning_modules
#
# C1 TELEMETRY LEARNING MODULE -- the executed arm.
#
# Character-for-character identical to the shipped `evidence_1lm_nn10_dod003.yaml`
# except that the `defaults` line below points at the telemetry hypotheses
# updater instead of the plain one. Since the telemetry calculator returns the
# shipped calculator's output unchanged, this configuration is behaviourally an
# exact copy of stock Monty; it simply also writes down, for every scored step,
# how probable each candidate object was.
#
# To use it, swap `/monty/learning_module: evidence_1lm_nn10_dod003` for
# `evidence_1lm_c1_telemetry` in an experiment such as
# `randrot_noise_10distinctobj_dist_agent.yaml`, leaving the sensor module alone.
# The benchmark row must come out identical. That equality is the null gate.
#
# The `tolerances` block below is the one the whole thesis hangs on. A tolerance
# says how far an observation may drift from a remembered value and still count
# as a match. Probability theory calls the same idea by its inverse -- precision,
# one over tolerance squared (Feldman, H., & Friston, K. J. (2010), "Attention,
# uncertainty, and free-energy", Frontiers in Human Neuroscience, 4, 215) --
# which is the quantity the clinical literature implicates in hallucination and
# delusion. Note that `pose_vectors` has no tolerance entry here: pose is scored
# by a separate heuristic with no width parameter at all, so the
# tolerance-to-precision translation reaches only the non-pose features, which
# are exactly the ones Monty deliberately subordinates. That is a structural
# ceiling on how large any C1 or C2 effect can be, and it should be stated in
# advance rather than discovered afterwards.
#
# Reference publication: Leadholm, N., Clay, V., Knudstrup, S., Lee, H., &
# Hawkins, J. (2026). "Thousand Brains systems." Neural Computation, 38(6),
# 845-896. See `Private_Monty_journal/v4/c1_gaussian_likelihood_calculator.md`.

defaults:
  - hypotheses_updater/burst_sampling_10nn_telemetry@learning_module_0

learning_module_0:
  _target_: tbp.monty.frameworks.models.evidence_matching.learning_module.EvidenceGraphLM
  feature_weights:
    patch:
      hsv: ${np.array:[2, 0.5, 0.5]}
      pose_vectors: ${np.ones:3}
      principal_curvatures_log: ${np.ones:2}
  tolerances:
    patch:
      hsv: ${np.array:[0.1, 0.2, 0.2]}
      principal_curvatures_log: ${np.ones:2}
  max_match_distance: 0.01
  x_percent_threshold: 20
  evidence_threshold_config: all
  max_graph_size: 0.3
  num_model_voxels_per_dim: 100
  gsg:
    _target_: tbp.monty.frameworks.models.goal_generation.EvidenceGoalGenerator
    goal_tolerances:
      location: 0.015
    elapsed_steps_factor: 10
    min_post_goal_success_steps: 5
    x_percent_scale_factor: 0.75
    desired_object_distance: 0.03
